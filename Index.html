<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Smart Attendance System</title>
  
  <!-- Fast QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #eef2f6; display: flex; justify-content: center; padding: 15px 10px; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    .step-indicator { text-align: center; font-size: 13px; font-weight: bold; color: #5f6368; margin-bottom: 15px; }

    label { font-size: 13px; font-weight: 600; color: #444; display: block; margin-top: 10px; text-align: left; }
    input { width: 100%; padding: 12px; margin-top: 4px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
    input:focus { border-color: #1a73e8; }

    .btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn:active { background: #1557b0; }
    .btn-selfie { background: #0b8043; }
    .btn-secondary { background: #6c757d; margin-top: 8px; }

    #reader { width: 100%; margin-top: 15px; border-radius: 10px; overflow: hidden; }
    
    /* Selfie Camera Preview */
    #selfie-wrapper { display: none; width: 100%; margin-top: 15px; text-align: center; }
    #selfie-video { width: 100%; height: 260px; object-fit: cover; border-radius: 10px; background: #000; transform: scaleX(-1); }
    #selfie-preview { display: none; width: 100%; height: 260px; object-fit: cover; border-radius: 10px; margin-top: 10px; }

    #status-box { margin-top: 15px; padding: 12px; font-size: 14px; border-radius: 8px; display: none; font-weight: bold; text-align: center; line-height: 1.4; }
    .status-info { background: #e8f0fe; color: #1a73e8; display: block !important; }
    .status-success { background: #e6f4ea; color: #137333; display: block !important; }
    .status-error { background: #fce8e6; color: #c5221f; display: block !important; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Smart Attendance</h2>
    <div class="step-indicator" id="step-txt">चरण 1: अपनी जानकारी भरें</div>

    <div id="status-box"></div>

    <!-- STEP 1: FORM -->
    <div id="section-form">
      <label>कर्मचारी ID (Login ID):</label>
      <input type="text" id="emp-id" placeholder="उदा. EMP001" value="EMP001">

      <label>कर्मचारी का पूरा नाम:</label>
      <input type="text" id="emp-name" placeholder="अपना नाम लिखें" value="Rahul Sharma">

      <label>Google / Gmail ID:</label>
      <input type="email" id="emp-gmail" placeholder="example@gmail.com" value="rahul@gmail.com">

      <button type="button" class="btn" onclick="startQRStep()">📷 QR Code स्कैन करें</button>
    </div>

    <!-- STEP 2: QR CODE SCANNER -->
    <div id="section-qr" class="hidden">
      <div id="reader"></div>
      <button type="button" class="btn btn-secondary" onclick="resetAll()">रद्द करें</button>
    </div>

    <!-- STEP 3: SELFIE CAPTURE -->
    <div id="section-selfie" class="hidden">
      <div id="selfie-wrapper">
        <video id="selfie-video" autoplay playsinline muted></video>
        <canvas id="selfie-canvas" style="display: none;"></canvas>
        <img id="selfie-preview" alt="Captured Selfie">
      </div>
      <button type="button" class="btn btn-selfie" id="snap-btn" onclick="takeSelfie()">🤳 फोटो खींचें (Capture Photo)</button>
      <button type="button" class="btn hidden" id="submit-btn" onclick="getGPSAndSubmitAttendance()">📤 उपस्थिति दर्ज करें</button>
      <button type="button" class="btn btn-secondary" onclick="resetAll()">रद्द करें</button>
    </div>

  </div>

  <script>
    // 👇👇 ⚠️ इस लाइन में अपना Google Apps Script Web App URL डालें 👇👇
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVHs3gdNe2qvumCUEmrhHIH7Z8Qz4g5NuJ8VDnccAM1YnqF-tVNme9ZviqC4QEu290/exec";

    let html5QrCode = null;
    let scannedQRData = null;
    let selfieBase64Data = null;
    let frontStream = null;

    function setStatus(msg, type) {
      const box = document.getElementById("status-box");
      box.className = "status-" + type;
      box.innerText = msg;
    }

    function clearStatus() {
      document.getElementById("status-box").style.display = "none";
    }

    // Step 1: Open Back Camera for QR Code
    function startQRStep() {
      const id = document.getElementById("emp-id").value.trim();
      const name = document.getElementById("emp-name").value.trim();
      const gmail = document.getElementById("emp-gmail").value.trim();

      if (!id || !name || !gmail) {
        setStatus("कृपया ID, नाम और Gmail तीनों भरें!", "error");
        return;
      }

      clearStatus();
      document.getElementById("section-form").classList.add("hidden");
      document.getElementById("section-qr").classList.remove("hidden");
      document.getElementById("step-txt").innerText = "चरण 2: QR Code को स्कैन करें";

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" }, // Rear Camera
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onQRSuccess
      ).catch(err => {
        setStatus("कैमरा नहीं खुला: " + err + "। कृपया ब्राउज़र में Camera Allow करें।", "error");
      });
    }

    function onQRSuccess(decodedText) {
      scannedQRData = decodedText;
      html5QrCode.stop().then(() => {
        document.getElementById("reader").innerHTML = "";
        document.getElementById("section-qr").classList.add("hidden");
        startSelfieStep();
      });
    }

    // Step 2: Open Front Camera for Selfie
    async function startSelfieStep() {
      document.getElementById("section-selfie").classList.remove("hidden");
      document.getElementById("selfie-wrapper").style.display = "block";
      document.getElementById("step-txt").innerText = "चरण 3: अपनी लाइव सेल्फी खींचें";
      setStatus("सामने देखकर फोटो खीचें", "info");

      try {
        frontStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        const video = document.getElementById("selfie-video");
        video.srcObject = frontStream;
        video.play();
      } catch (err) {
        setStatus("सेल्फी कैमरा नहीं खुल सका: " + err.message, "error");
      }
    }

    function takeSelfie() {
      const video = document.getElementById("selfie-video");
      const canvas = document.getElementById("selfie-canvas");
      canvas.width = 400;
      canvas.height = 300;
      const ctx = canvas.getContext("2d");

      // Mirror flip matching front camera
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      selfieBase64Data = canvas.toDataURL("image/jpeg", 0.7);

      // Stop video stream
      if (frontStream) {
        frontStream.getTracks().forEach(t => t.stop());
        frontStream = null;
      }

      video.style.display = "none";
      const preview = document.getElementById("selfie-preview");
      preview.src = selfieBase64Data;
      preview.style.display = "block";

      document.getElementById("snap-btn").classList.add("hidden");
      document.getElementById("submit-btn").classList.remove("hidden");
      setStatus("सेल्फी ले ली गई है। अब उपस्थिति दर्ज करें बटन दबाएं।", "success");
    }

    // Step 3: Capture Live GPS & Post Data to Google Sheet
    function getGPSAndSubmitAttendance() {
      setStatus("Live GPS लोकेशन प्राप्त की जा रही है...", "info");
      document.getElementById("submit-btn").disabled = true;

      if (!navigator.geolocation) {
        setStatus("इस डिवाइस में GPS सपोर्ट नहीं है।", "error");
        document.getElementById("submit-btn").disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          setStatus("डाटा और फोटो Google Drive/Sheets में भेजा जा रहा है...", "info");

          const payload = {
            loginId: document.getElementById("emp-id").value.trim(),
            employeeName: document.getElementById("emp-name").value.trim(),
            gmail: document.getElementById("emp-gmail").value.trim(),
            qrCodeData: scannedQRData,
            liveLat: pos.coords.latitude,
            liveLng: pos.coords.longitude,
            selfieBase64: selfieBase64Data
          };

          fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              setStatus("✔ " + res.message, "success");
              document.getElementById("submit-btn").classList.add("hidden");
              document.getElementById("step-txt").innerText = "उपस्थिति पूरी हुई!";
            } else {
              setStatus("❌ " + res.message, "error");
              document.getElementById("submit-btn").disabled = false;
            }
          })
          .catch(err => {
            setStatus("सर्वर त्रुटि: " + err, "error");
            document.getElementById("submit-btn").disabled = false;
          });
        },
        err => {
          setStatus("GPS बंद है! फोन सेटिंग में Location चालू करें।", "error");
          document.getElementById("submit-btn").disabled = false;
        },
        { enableHighAccuracy: true, timeout: 12000 }
      );
    }

    function resetAll() {
      if (html5QrCode) {
        try { html5QrCode.stop(); } catch(e){}
      }
      if (frontStream) {
        frontStream.getTracks().forEach(t => t.stop());
      }
      location.reload();
    }
  </script>
</body>
</html>
